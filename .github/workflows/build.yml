# Sta nella repo pubblica TD-Vexa-per-Windows: compila il sorgente della repo privata TD-Vexa e pubblica qui i due
# MSI. Così la build non consuma i minuti delle repo private e i programmi installati scaricano gli aggiornamenti
# senza credenziali. Il sorgente non passa mai di qui: solo il registro della build è pubblico.
# Secret di questa repo: SORGENTE_TOKEN (token con Contents in lettura e scrittura sulla sola TD-Vexa), facoltativi
# quelli della firma. Le licenze si creano con TD Licenze, il gestore unico della repo TD-Licenze: qui non si costruisce più.
name: Build

on:
  workflow_dispatch:
    inputs:
      rilascio:
        description: "Pubblica il rilascio con i due MSI"
        type: boolean
        default: false
      vetrina:
        description: "Aggiorna la pagina e le schermate, senza pubblicare un rilascio"
        type: boolean
        default: false
      ramo:
        description: "Ramo o tag del sorgente"
        default: main

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    permissions:
      contents: write  # il rilascio si pubblica da questo job, senza artefatti in mezzo
    timeout-minutes: 60
    steps:
      - name: Sorgente (repo privata)
        uses: actions/checkout@v4
        with:
          repository: tastieredigitali/TD-Vexa
          token: ${{ secrets.SORGENTE_TOKEN }}
          ref: ${{ inputs.ramo || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache dei download
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('windows/build.ps1') }}

      # il PostgreSQL del runner, per i test: quello del programma lo installa l'MSI sulla sua porta
      - name: PostgreSQL per i test
        run: |
          $service = Get-Service "postgresql*" | Select-Object -First 1
          Set-Service $service.Name -StartupType Manual
          Start-Service $service.Name
          $env:PGPASSWORD = "root"
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres banco_test
          if ($LASTEXITCODE -ne 0) { throw "createdb non riuscito" }
          "BANCO_TEST_DSN=postgresql://postgres:root@127.0.0.1:5432/banco_test" >> $env:GITHUB_ENV

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          python -m pytest -q

      - name: MSI
        id: msi
        env:
          TDSK_RILASCIO: ${{ inputs.rilascio }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          pwsh windows/build.ps1
          "version=$((Get-Content VERSION).Trim())" >> $env:GITHUB_OUTPUT

      - name: Prova di installazione
        run: pwsh windows/smoke-test.ps1

      # le schermate che il programma ha fatto di se stesso durante la prova, a ogni build anche se la prova si ferma:
      # stanno nella cartella schermate di questa repo, per guardare com'è venuto senza installarlo
      - name: Schermate del programma
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d build/schermate ] || exit 0
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" schermate-repo
          rm -rf schermate-repo/schermate && mkdir -p schermate-repo/schermate
          cp build/schermate/* schermate-repo/schermate/
          cd schermate-repo
          git config user.name "TD Vexa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A schermate
          git diff --cached --quiet || git commit -q -m "Schermate della build $(cat ../VERSION)"
          git push -q origin HEAD:main

      # il programma controlla con questi file l'MSI che scarica per Aggiorna ora
      - name: SHA-256 degli MSI
        if: inputs.rilascio
        shell: bash
        run: cd dist && for f in *.msi; do sha256sum "$f" > "$f.sha256"; done && cat *.sha256

      - name: Rilascio con gli MSI
        if: inputs.rilascio
        shell: bash
        env:
          TAG: v${{ steps.msi.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.msi dist/*.msi.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.msi dist/*.msi.sha256 --repo "$GITHUB_REPOSITORY" --target main \
              --title "TD Vexa $TAG" \
              --notes "Due installer: TD-Vexa-Server per il PC che tiene i dati, TD-Vexa-Postazione per gli altri PC. 7 giorni di prova. Firmati digitalmente da Tastiere Digitali."
          fi

      # la pagina di questa repo: README e schermate, mai il codice
      - name: Pagina della vetrina
        if: inputs.rilascio || inputs.vetrina
        shell: bash
        env:
          TAG: v${{ steps.msi.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" vetrina-repo
          cp vetrina/README.md vetrina-repo/README.md
          # il nome delle figure non cambia: senza la versione in coda il browser continua a mostrare quelle vecchie
          sed -i -E "s#(screenshots/[a-z-]+\.png)#\1?v=${TAG}#g" vetrina-repo/README.md
          # le figure della pagina: alcune schermate fatte da questa build, con un nome che non cambia quando cambia il menu
          mkdir -p vetrina-repo/screenshots
          prendi() { for f in build/schermate/*"$1"; do [ -f "$f" ] && cp "$f" "vetrina-repo/screenshots/$2" && return 0; done; echo "::warning::manca la schermata per la pagina: $1"; }
          prendi " Vendite - Vendite immediate.png" vendite.png
          prendi " Vendite - Chiusure giornaliere.png" cassa.png
          prendi " Vendite - Report del giorno e del periodo.png" report.png
          prendi " stampa Preventivo 1.png" stampa-preventivo.png
          prendi " Assistenza - Accettazione assistenza.png" assistenza.png
          prendi " Magazzino - Stampe magazzino.png" giacenze.png
          prendi " scheda articolo.png" scheda-articolo.png
          prendi " stampa Fattura 1.png" stampa-fattura.png
          prendi " tema scuro - articoli.png" tema-scuro.png
          prendi " Assistenza - Gestione interventi.png" interventi.png
          prendi " Documenti - Ordini clienti.png" ordini.png
          prendi " Magazzino - Modifica arrivi.png" arrivi.png
          prendi " Configurazione e utilità - Opzioni.png" opzioni.png
          prendi " ricerca clienti.png" ricerca-clienti.png
          # le figure dell'uso dal browser stanno nel sorgente: le fa il giro nel browser (tests/web_giro.py)
          cp vetrina/screenshots/*.png vetrina-repo/screenshots/ 2>/dev/null || true
          cd vetrina-repo
          git config user.name "TD Vexa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md screenshots 2>/dev/null || git add README.md
          git diff --cached --quiet || git commit -q -m "TD Vexa $TAG"
          git push -q origin HEAD:main
